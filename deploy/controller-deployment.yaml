apiVersion: apps/v1
kind: Deployment
metadata:
  name: dag-pipeline-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dag-pipeline-controller
  template:
    metadata:
      labels:
        app: dag-pipeline-controller
    spec:
      serviceAccountName: pipeline-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: controller
        image: dag-pipeline-controller:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: MINIO_ENDPOINT
          value: http://minio.minio:9000
        # Storage credentials come from a Secret (see config/minio-secret.yaml); there is no built-in default.
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: accessKey
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secretKey
        # Worker pods read the same keys from this Secret (it must exist in each job's namespace)
        - name: WORKER_CREDENTIALS_SECRET
          value: minio-credentials
        # Address worker pods use to reach MinIO (may differ from the controller's when it runs outside the cluster)
        - name: WORKER_MINIO_ENDPOINT
          value: http://minio.minio:9000
        # Safe to scale replicas above 1: only the elected leader reconciles
        - name: LEADER_ELECT
          value: "true"
