apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-controller
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipeline-controller-role
rules:
  # PipelineJob objects are only read; state changes go through the status subresource.
  - apiGroups: ["pipeline.io"]
    resources: ["pipelinejobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pipeline.io"]
    resources: ["pipelinejobs/status"]
    verbs: ["get", "update", "patch"]
  # Needed to set ownerReferences with blockOwnerDeletion on the underlying Jobs
  - apiGroups: ["pipeline.io"]
    resources: ["pipelinejobs/finalizers"]
    verbs: ["update"]

  # Admission control reads node allocatable capacity and the requests of running pods.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]

  # The controller creates and deletes the worker Jobs (pods are removed by the Job controller).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]

  # Events emitted by leader election
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipeline-controller-role
subjects:
  - kind: ServiceAccount
    name: pipeline-controller
    namespace: default
