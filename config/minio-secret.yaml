# Storage credentials, read by MinIO, the controller and the worker pods through
# secretKeyRef (they never appear as literal values in any pod spec).
#
# The values below are throw-away DEMO credentials for a local kind cluster.
# For anything else create the Secret yourself instead of applying this file:
#
#   kubectl create secret generic minio-credentials \
#     --from-literal=accessKey="$ACCESS_KEY" --from-literal=secretKey="$SECRET_KEY"
#   kubectl -n minio create secret generic minio-credentials \
#     --from-literal=accessKey="$ACCESS_KEY" --from-literal=secretKey="$SECRET_KEY"
#
# A Secret is namespaced: it is needed in `minio` (for MinIO itself) and in every
# namespace where PipelineJobs run (the controller and the worker pods).
# On AWS use IRSA / an instance role instead of static keys (see the README).
# The namespace is also declared in minio.yaml; declaring it here lets this file be applied first.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: minio
type: Opaque
stringData:
  accessKey: demo-access-key
  secretKey: demo-secret-key-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
type: Opaque
stringData:
  accessKey: demo-access-key
  secretKey: demo-secret-key-change-me
