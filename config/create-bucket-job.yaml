# One-off Job that creates the bucket used by the example pipelines.
# It uses the worker image (which contains `mc`) and the same credentials Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: default
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: pipeline-job:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              mc alias set s http://minio.minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" &&
              mc mb --ignore-existing s/test-bucket
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accessKey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretKey
